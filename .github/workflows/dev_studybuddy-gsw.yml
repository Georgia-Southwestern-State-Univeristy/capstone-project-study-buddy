name: Build & Deploy – studybuddy-Gsw

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - run: npm ci --prefix meme_mingle

      - run: npx ng build --configuration production --project meme_mingle

      - run: |
          cd meme_mingle
          zip -r ../release.zip \
              dist/meme-mingle \
              server.js \
              package.json

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: studybuddy-Gsw
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A78A924CE36A49C5BBB15A3DC10C2BDC }}
          package: release.zip   # deploy EXACT artifact
